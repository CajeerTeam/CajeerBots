name: Refresh security remediation lockfile
on:
  push:
    branches: ['release/1.0.0-security']
    paths:
      - '.github/workflows/security-lockfile-refresh.yml'
      - '**/package.json'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@9.15.9
      - name: Resolve and verify lockfile on remediation branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release/1.0.0-security
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          pnpm install --lockfile-only --no-frozen-lockfile
          test -s pnpm-lock.yaml
          before=$(sha256sum pnpm-lock.yaml)
          pnpm install --frozen-lockfile
          test "$before" = "$(sha256sum pnpm-lock.yaml)"
          git diff --exit-code -- . ':!pnpm-lock.yaml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'chore(security): regenerate verified dependency lockfile'
            git push origin HEAD:refs/heads/release/1.0.0-security
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: security-remediation-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
      - name: Audit resolved dependencies
        run: |
          set -euo pipefail
          status=0
          pnpm audit --audit-level high --json > "$RUNNER_TEMP/audit.json" || status=$?
          node -e 'const a=require(process.argv[1]); console.log(JSON.stringify(a.metadata?.vulnerabilities??a.error??{})); for(const v of Object.values(a.advisories??{}))if(["high","critical"].includes(v.severity))console.log(JSON.stringify({package:v.module_name,title:v.title,patched:v.patched_versions,url:v.url})); const c=a.metadata?.vulnerabilities;if(a.error||!c||c.high!==0||c.critical!==0)process.exit(1)' "$RUNNER_TEMP/audit.json"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: security-remediation-audit
          path: ${{ runner.temp }}/audit.json
          if-no-files-found: warn
