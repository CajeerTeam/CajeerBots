name: Stable verified release artifacts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-hardening.yml'
      - 'VERSION'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '**/package.json'
      - '.npmrc'
      - '.nvmrc'
      - 'docker/*.Dockerfile'
      - 'tsconfig.seed.json'
      - 'prisma/seed.ts'
      - 'scripts/container-audit-diagnostics.mjs'
      - 'scripts/runtime-os-inventory.mjs'
      - 'scripts/runtime-image-preflight.mjs'
      - 'scripts/instance-ops.mjs'
      - 'docker-compose*.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release-hardening.yml'
      - 'VERSION'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '**/package.json'
      - '.npmrc'
      - '.nvmrc'
      - 'docker/*.Dockerfile'
      - 'tsconfig.seed.json'
      - 'prisma/seed.ts'
      - 'scripts/container-audit-diagnostics.mjs'
      - 'scripts/runtime-os-inventory.mjs'
      - 'scripts/runtime-image-preflight.mjs'
      - 'scripts/instance-ops.mjs'
      - 'docker-compose*.yml'
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Exact RC6 commit SHA
        required: true
      events:
        description: Events per phase
        default: '1000'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@9.15.9
      - name: Audit locked dependencies (fail closed)
        run: |
          set -euo pipefail
          test -s pnpm-lock.yaml
          status=0
          pnpm audit --audit-level high --json > "$RUNNER_TEMP/audit.json" || status=$?
          node --input-type=module - "$RUNNER_TEMP/audit.json" "$status" <<'NODE'
          import { readFileSync } from 'node:fs';
          let report;
          try { report = JSON.parse(readFileSync(process.argv[2], 'utf8')); }
          catch { console.error('Audit did not produce valid JSON; inspect the audit artifact and registry connectivity.'); process.exit(1); }
          if (report.error) {
            console.error('Audit registry error:', JSON.stringify({ code: report.error.code ?? 'unknown', message: report.error.message ?? 'unknown' }));
            process.exit(1);
          }
          const counts = report.metadata?.vulnerabilities;
          const levels = ['info', 'low', 'moderate', 'high', 'critical'];
          if (!counts || !levels.every(level => Number.isInteger(counts[level]) && counts[level] >= 0)
              || !Number.isInteger(report.metadata.totalDependencies) || report.metadata.totalDependencies <= 0
              || !report.advisories || typeof report.advisories !== 'object' || Array.isArray(report.advisories)) {
            console.error('Incomplete audit report; refusing release.');
            process.exit(1);
          }
          // pnpm 9.15.9 JSON mode returns 1 for ANY advisory, regardless of --audit-level.
          // Require its exact documented JSON-mode exit code and enforce the HIGH/CRITICAL policy independently.
          const total = levels.reduce((sum, level) => sum + counts[level], 0);
          if (Number(process.argv[3]) !== (total > 0 ? 1 : 0)) {
            console.error('Unexpected pnpm audit exit code:', process.argv[3]);
            process.exit(1);
          }
          console.log('Audit severity counts:', JSON.stringify(counts ?? null));
          for (const advisory of Object.values(report.advisories ?? {})) {
            if (['high', 'critical'].includes(advisory.severity)) console.log(JSON.stringify({ package: advisory.module_name, severity: advisory.severity, title: advisory.title, vulnerable: advisory.vulnerable_versions, patched: advisory.patched_versions, url: advisory.url, paths: advisory.findings?.flatMap(f => f.paths ?? []) }));
          }
          for (const [name, vulnerability] of Object.entries(report.vulnerabilities ?? {})) {
            if (['high', 'critical'].includes(vulnerability.severity)) console.log(JSON.stringify({ package: name, severity: vulnerability.severity, range: vulnerability.range, fixAvailable: vulnerability.fixAvailable, via: vulnerability.via }));
          }
          if (counts.high !== 0 || counts.critical !== 0 || Object.values(report.advisories).some(a => ['high', 'critical'].includes(a.severity))) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: dependency-audit-report
          path: ${{ runner.temp }}/audit.json
          if-no-files-found: error
          retention-days: 14
  container-audit:
    if: >-
      ${{ github.event_name != 'workflow_dispatch' && !(github.event_name == 'push' && github.event.head_commit.message == 'release: CajeerBots 1.0.1') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build candidate runtime image
        run: docker build --pull --label "org.opencontainers.image.revision=$GITHUB_SHA" -f docker/api.Dockerfile -t cajeerbots:1.0.1 .
      - name: Verify shell-free runtime inventory
        run: docker run --rm --network none --entrypoint node cajeerbots:1.0.1 scripts/runtime-image-preflight.mjs
      - name: Scan candidate image
        id: candidate-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cajeerbots:1.0.1
          format: json
          output: ${{ runner.temp }}/container-audit.json
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: false
          exit-code: '1'
      - name: Print container audit findings
        if: ${{ always() && (steps.candidate-scan.outcome == 'success' || steps.candidate-scan.outcome == 'failure') }}
        run: node scripts/container-audit-diagnostics.mjs "$RUNNER_TEMP/container-audit.json" "$RUNNER_TEMP/container-audit-diagnostics.json"
      - name: Save container audit diagnostics
        if: ${{ always() && (steps.candidate-scan.outcome == 'success' || steps.candidate-scan.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: candidate-container-audit-report
          path: ${{ runner.temp }}/container-audit-diagnostics.json
          if-no-files-found: warn
          retention-days: 14
  verified-release:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'release: CajeerBots 1.0.1') }}
    needs: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    env:
      DATABASE_URL: postgresql://cajeerbots:cajeerbots@localhost:5432/cajeerbots?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      API_TOKEN_PEPPER: ci-only-token-pepper-not-for-production
      CAJEER_ADMIN_TOKEN: ci-only-admin-token-not-for-production
      SECRETS_ENCRYPTION_KEY: ci-only-secret-key-not-for-production
      NODE_ENV: test
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: cajeerbots
          POSTGRES_USER: cajeerbots
          POSTGRES_PASSWORD: cajeerbots
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U cajeerbots" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.3-bookworm
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate release signing key pair
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_ED25519_PRIVATE_KEY }}
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_ED25519_PUBLIC_KEY }}
        run: node scripts/release-key-preflight.mjs
      - run: npm install --global pnpm@9.15.9
      - uses: actions/download-artifact@v4
        with:
          name: dependency-audit-report
          path: ${{ runner.temp }}
      - name: Frozen dependencies, build and tests
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 1.0.1
          test -f pnpm-lock.yaml
          pnpm install --frozen-lockfile
          pnpm prisma:validate
          pnpm build
          pnpm typecheck
          pnpm lint
          pnpm prisma:deploy
          pnpm prisma:seed
          pnpm test
          pnpm test:stabilization
          pnpm test:product-completion
          pnpm test:rehearsal-unit
          pnpm test:release-hardening
          pnpm test:stable
          node --test scripts/rc3-security.test.mjs
          pnpm test:e2e
          pnpm -r list --prod --depth Infinity --json > "$RUNNER_TEMP/dependencies.json"
      - name: Validate baseline SHA
        env:
          BASELINE: ${{ inputs.baseline_ref || 'd3838069c9361bd722af43a9dfe7805b96e9f030' }}
        run: '[[ "$BASELINE" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_ref || 'd3838069c9361bd722af43a9dfe7805b96e9f030' }}
          path: .tmp/rc6
          persist-credentials: false
      - name: Build immutable rehearsal inputs
        run: |
          set -euo pipefail
          test "$(cat .tmp/rc6/VERSION)" = 1.0.0-rc.6
          test -f .tmp/rc6/pnpm-lock.yaml
          docker build -f .tmp/rc6/docker/api.Dockerfile -t cajeerbots:rehearsal-rc6 .tmp/rc6
          docker build --pull --label "org.opencontainers.image.revision=$GITHUB_SHA" -f docker/api.Dockerfile -t cajeerbots:1.0.1 .
      - name: Verify shell-free runtime inventory
        run: docker run --rm --network none --entrypoint node cajeerbots:1.0.1 scripts/runtime-image-preflight.mjs
      - name: Preflight rehearsal workload in both immutable images
        run: |
          set -euo pipefail
          for image in cajeerbots:rehearsal-rc6 cajeerbots:1.0.1; do
            docker run --rm --network none --entrypoint node \
              --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/rehearsal-workload.mjs,dst=/app/scripts/rehearsal-workload.mjs,readonly" \
              --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/rehearsal-load.mjs,dst=/app/scripts/rehearsal-load.mjs,readonly" \
              "$image" scripts/rehearsal-workload.mjs --check-imports
          done
      - name: Load independently verified 1.0.0 patch baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/previous-stable"
          gh api repos/CajeerTeam/CajeerBots/actions/artifacts/14025468350 > "$RUNNER_TEMP/previous-artifact.json"
          jq -e '.name == "cajeerbots-1.0.0-verified" and .expired == false and .workflow_run.id == 43398376975 and .workflow_run.head_sha == "40550b595866099d4390a26a00b5d60650da439f"' "$RUNNER_TEMP/previous-artifact.json"
          gh run download 43398376975 --name cajeerbots-1.0.0-verified --dir "$RUNNER_TEMP/previous-stable"
          cat > "$RUNNER_TEMP/previous-public.pem" <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MCowBQYDK2VwAyEAxpjDoo3A++d9VAT6EgRdPDIF8kPsqGIhdmIZ4IpJCsI=
          -----END PUBLIC KEY-----
          KEY
          node scripts/release-verify.mjs "$RUNNER_TEMP/previous-stable" 1.0.0 "$RUNNER_TEMP/previous-public.pem"
          jq -e '.commit == "40550b595866099d4390a26a00b5d60650da439f"' "$RUNNER_TEMP/previous-stable/cajeerbots-1.0.0.manifest.json"
          docker load --input "$RUNNER_TEMP/previous-stable/cajeerbots-1.0.0.image.tar.gz"
          test "$(docker image inspect --format '{{.Id}}' cajeerbots:1.0.0)" = sha256:442e91aa9fe026983fce4e024f0152300c828bc0e22cfbf30599efe0dcd91618
      - name: Full production rehearsal
        id: rehearsal
        env:
          CAJEER_REHEARSAL_ISOLATED: '1'
          REHEARSAL_EVENTS: ${{ inputs.events || '1000' }}
          REHEARSAL_MIN_RPS: '10'
        run: node scripts/production-rehearsal.mjs cajeerbots:rehearsal-rc6 cajeerbots:1.0.1 "$RUNNER_TEMP/rehearsal.json" "$REHEARSAL_EVENTS" 16 cajeerbots:1.0.0
      - name: Save production rehearsal report
        if: ${{ always() && (steps.rehearsal.outcome == 'success' || steps.rehearsal.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: production-rehearsal-report
          path: ${{ runner.temp }}/rehearsal.json
          if-no-files-found: warn
          retention-days: 14
      - name: Generate CycloneDX inventory from installed dependencies and tested image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint node cajeerbots:1.0.1 scripts/runtime-os-inventory.mjs > "$RUNNER_TEMP/dpkg.tsv"
          node_version=$(docker run --rm --entrypoint node cajeerbots:1.0.1 --version)
          node scripts/release-sbom.mjs "$RUNNER_TEMP/dependencies.json" "$RUNNER_TEMP/dpkg.tsv" "$node_version" "$RUNNER_TEMP/sbom.cdx.json"
      - name: Scan exact runtime image (OS and libraries)
        id: release-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cajeerbots:1.0.1
          format: json
          output: ${{ runner.temp }}/container-audit.json
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: false
          exit-code: '1'
      - name: Print container audit findings
        if: ${{ always() && (steps.release-scan.outcome == 'success' || steps.release-scan.outcome == 'failure') }}
        run: node scripts/container-audit-diagnostics.mjs "$RUNNER_TEMP/container-audit.json" "$RUNNER_TEMP/container-audit-diagnostics.json"
      - name: Save container audit diagnostics
        if: ${{ always() && (steps.release-scan.outcome == 'success' || steps.release-scan.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-container-audit-report
          path: ${{ runner.temp }}/container-audit-diagnostics.json
          if-no-files-found: warn
          retention-days: 14
      - name: Export exact tested runtime image
        run: |
          set -euo pipefail
          docker save cajeerbots:1.0.1 | gzip -n > "$RUNNER_TEMP/image.tar.gz"
      - name: Sign and verify release artifacts
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_ED25519_PRIVATE_KEY }}
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_ED25519_PUBLIC_KEY }}
          RELEASE_REQUIRE_EVIDENCE: '1'
        run: |
          set -euo pipefail
          umask 077
          node scripts/release-key-preflight.mjs
          test -n "$RELEASE_PRIVATE_KEY"
          test -n "$RELEASE_PUBLIC_KEY"
          key=$(mktemp)
          pub=$(mktemp)
          trap 'rm -f "$key" "$pub"' EXIT
          printf '%s\n' "$RELEASE_PRIVATE_KEY" > "$key"
          printf '%s\n' "$RELEASE_PUBLIC_KEY" > "$pub"
          unset RELEASE_PRIVATE_KEY RELEASE_PUBLIC_KEY
          RELEASE_SIGNING_KEY_FILE="$key" RELEASE_IMAGE_FILE="$RUNNER_TEMP/image.tar.gz" RELEASE_SBOM_FILE="$RUNNER_TEMP/sbom.cdx.json" RELEASE_AUDIT_FILE="$RUNNER_TEMP/audit.json" RELEASE_REHEARSAL_FILE="$RUNNER_TEMP/rehearsal.json" RELEASE_CONTAINER_AUDIT_FILE="$RUNNER_TEMP/container-audit.json" pnpm release:dist
          pnpm release:verify dist-release/cajeerbots-1.0.1 1.0.1 "$pub"
          openssl pkey -pubin -in "$pub" -pubout > dist-release/cajeerbots-1.0.1/release-public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: cajeerbots-1.0.1-verified
          path: dist-release/cajeerbots-1.0.1/
          if-no-files-found: error

  publish:
    if: ${{ github.repository == 'CajeerTeam/CajeerBots' && github.ref == 'refs/heads/main' }}
    needs: verified-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: CajeerTeam/CajeerBots
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cajeerbots-1.0.1-verified
          path: ${{ runner.temp }}/verified
      - name: Verify exact signed release and publish v1.0.1
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/verified"
          tag=v1.0.1
          cat > "$RUNNER_TEMP/trusted-release-public.pem" <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MCowBQYDK2VwAyEAxpjDoo3A++d9VAT6EgRdPDIF8kPsqGIhdmIZ4IpJCsI=
          -----END PUBLIC KEY-----
          KEY
          cmp "$dir/release-public.pem" "$RUNNER_TEMP/trusted-release-public.pem"
          node scripts/release-verify.mjs "$dir" 1.0.1 "$RUNNER_TEMP/trusted-release-public.pem"
          jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' "$dir/cajeerbots-1.0.1.manifest.json"
          (cd "$dir" && sha256sum -c SHA256SUMS)
          files=("$dir"/*)
          test "${#files[@]}" = 10
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$tag" "$RUNNER_TEMP/release-tags"; then echo "Release already exists"; exit 1; fi
          gh api --paginate "repos/$GH_REPO/tags?per_page=100" --jq '.[].name' > "$RUNNER_TEMP/git-tags"
          if grep -Fxq "$tag" "$RUNNER_TEMP/git-tags"; then echo "Tag already exists"; exit 1; fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "CajeerBots 1.0.1 — Stable Release" --notes "Stable patch: consistent version metadata, verified RC6 and 1.0.0 upgrade/restore, signed production image and evidence. All mandatory gates passed. Source: $GITHUB_SHA. Validation: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID" "${files[@]}"
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "v1.0.1")' > "$RUNNER_TEMP/draft.json"
          jq -e --arg sha "$GITHUB_SHA" '.draft == true and .prerelease == false and .target_commitish == $sha and (.assets|length) == 10' "$RUNNER_TEMP/draft.json"
          for file in "${files[@]}"; do
            name=$(basename "$file")
            asset=$(jq -ce --arg name "$name" '.assets[] | select(.name == $name and .state == "uploaded")' "$RUNNER_TEMP/draft.json")
            test "$(jq -r .size <<< "$asset")" = "$(stat -c %s "$file")"
            digest=$(jq -r '.digest // ""' <<< "$asset")
            if test -n "$digest"; then
              test "$digest" = "sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
            else
              gh api -H 'Accept: application/octet-stream' "repos/$GH_REPO/releases/assets/$(jq -r .id <<< "$asset")" > "$RUNNER_TEMP/asset-check"
              cmp "$file" "$RUNNER_TEMP/asset-check"
              rm "$RUNNER_TEMP/asset-check"
            fi
          done
          gh release edit "$tag" --draft=false --latest
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
          gh api "repos/$GH_REPO/releases/tags/$tag" --jq '{html_url,tag_name,draft,prerelease,assets: [.assets[].name]}'
