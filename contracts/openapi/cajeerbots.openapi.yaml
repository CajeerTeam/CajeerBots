openapi: 3.1.1
info:
  title: CajeerBots API
  version: 1.0.0-rc.6
  description: Русскоязычная TypeScript-first платформа для управления сообществами
    через Telegram, VK и Discord.
servers:
- url: /api
security:
- ApiKeyAuth: []
- BearerAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    Community:
      type: object
      required:
      - id
      - slug
      - title
      - language
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        language:
          type: string
    CreateCommunity:
      type: object
      required:
      - slug
      - title
      properties:
        slug:
          type: string
        title:
          type: string
        language:
          type: string
          default: ru
    ApiKey:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
    User:
      type: object
      properties:
        id:
          type: string
        provider:
          enum:
          - telegram
          - vk
          - discord
        externalId:
          type: string
        username:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        locale:
          type: string
    Role:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        title:
          type: string
        priority:
          type: integer
    BotAccount:
      type: object
      properties:
        id:
          type: string
        provider:
          enum:
          - telegram
          - vk
          - discord
        mode:
          enum:
          - polling
          - webhook
        username:
          type: string
          nullable: true
        tokenRef:
          type: string
          nullable: true
        isActive:
          type: boolean
    MessageTemplate:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        locale:
          type: string
        body:
          type: string
    Secret:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        ref:
          type: string
        description:
          type: string
          nullable: true
        version:
          type: integer
        updatedAt:
          type: string
          format: date-time
    RuntimeConfigSummary:
      type: object
      additionalProperties: true
    CommunityExport:
      type: object
      additionalProperties: true
    BotRuntimeStatus:
      type: object
      properties:
        accountId:
          type: string
        provider:
          enum:
          - telegram
          - vk
          - discord
        mode:
          enum:
          - polling
          - webhook
        isActive:
          type: boolean
        runtime:
          type: object
          nullable: true
    BotInboundUpdate:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        provider:
          enum:
          - telegram
          - vk
          - discord
        type:
          type: string
        status:
          type: string
        receivedAt:
          type: string
          format: date-time
    BotOutboundMessage:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        provider:
          enum:
          - telegram
          - vk
          - discord
        targetId:
          type: string
        text:
          type: string
        status:
          enum:
          - pending
          - sending
          - sent
          - failed
          - dead
        attempts:
          type: integer
    IntegrationTestSuite:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        title:
          type: string
        category:
          type: string
        isActive:
          type: boolean
    IntegrationTestCase:
      type: object
      properties:
        id:
          type: string
        suiteId:
          type: string
        code:
          type: string
        target:
          type: string
        kind:
          type: string
        definition:
          type: object
    IntegrationTestRun:
      type: object
      properties:
        id:
          type: string
        version:
          type: string
        channel:
          type: string
        status:
          type: string
        summary:
          type: object
    IntegrationTestCoverage:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        summary:
          type: object
        areas:
          type: array
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
  /auth/token:
    post:
      summary: Выпустить bootstrap JWT по CAJEER_ADMIN_TOKEN
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adminToken:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                ttlSeconds:
                  type: integer
      responses:
        '201':
          description: JWT issued
  /auth/me:
    get:
      summary: Текущий principal
      responses:
        '200':
          description: Principal
  /auth/api-keys:
    get:
      summary: Список API keys
      responses:
        '200':
          description: API keys
    post:
      summary: Создать API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - scopes
              properties:
                title:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                expiresAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: API key
          включая raw token только в этом ответе: null
  /auth/api-keys/{id}/revoke:
    post:
      summary: Отозвать API key
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Revoked
  /communities:
    get:
      summary: Список communities
      responses:
        '200':
          description: Communities
    post:
      summary: Создать community
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommunity'
      responses:
        '201':
          description: Created
  /communities/{communityId}/users:
    get:
      summary: Пользователи community
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Users
    post:
      summary: Создать пользователя
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
  /communities/{communityId}/roles:
    get:
      summary: Роли community
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Roles
    post:
      summary: Создать роль
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
  /communities/{communityId}/bot-accounts:
    get:
      summary: Bot accounts community
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Bot accounts
    post:
      summary: Создать bot account
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
  /communities/{communityId}/settings:
    get:
      summary: Настройки community
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Settings
  /message-templates:
    get:
      summary: Message templates
      responses:
        '200':
          description: Templates
    put:
      summary: Upsert message template
      responses:
        '200':
          description: Template
  /message-templates/{key}/render:
    post:
      summary: Render message template
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Rendered message
  /webhooks/events:
    post:
      summary: Принять signed event и поставить в outbox
      security: []
      responses:
        '202':
          description: Accepted
  /webhook-endpoints:
    get:
      summary: Webhook endpoints with recent deliveries
      responses:
        '200':
          description: Endpoints
    post:
      summary: Создать webhook endpoint
      responses:
        '201':
          description: Endpoint
  /outbox:
    get:
      summary: Outbox messages with deliveries
      responses:
        '200':
          description: Outbox
  /outbox/{id}/retry:
    post:
      summary: Повторить доставку outbox message
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Retried
  /extensions:
    get:
      summary: Extensions
      responses:
        '200':
          description: Extensions
  /extensions/install:
    post:
      summary: Установить extension manifest в БД
      responses:
        '201':
          description: Installed extension
  /extensions/{id}:
    get:
      summary: Получить расширение с permission grants, events и logs
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Extension
  /extensions/{id}/enable:
    post:
      summary: Включить расширение после проверки permission grants
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Enabled extension
  /extensions/{id}/disable:
    post:
      summary: Отключить расширение
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Disabled extension
  /extensions/{id}/permissions:
    get:
      summary: Permission grants расширения
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Grants
  /extensions/{id}/permissions/grant:
    post:
      summary: Выдать permissions расширению
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Grants
  /extensions/{id}/permissions/revoke:
    post:
      summary: Отозвать permissions расширения
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Grants
  /extensions/{id}/config:
    put:
      summary: Записать новую версию конфигурации расширения
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Config history entry
  /extensions/{id}/config/history:
    get:
      summary: История конфигурации расширения
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Config history
  /extensions/{id}/events:
    get:
      summary: Runtime events расширения
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: status
        required: false
        schema:
          type: string
      - in: query
        name: take
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Runtime events
    post:
      summary: Поставить runtime event расширения в очередь
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Enqueued
  /extensions/events/{eventId}/retry:
    post:
      summary: Повторить runtime event расширения
      parameters:
      - in: path
        name: eventId
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Retried
  /extensions/{id}/storage:
    get:
      summary: Key/value storage расширения по namespace
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: namespace
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Storage items
  /extensions/{id}/storage/{namespace}/{key}:
    put:
      summary: Записать значение в storage расширения
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      - in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Storage item
    delete:
      summary: Удалить значение из storage расширения
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      - in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted
  /extensions/{id}/logs:
    get:
      summary: Runtime logs расширения
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: take
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Runtime logs
  /audit:
    get:
      summary: Audit log
      responses:
        '200':
          description: Audit log
  /config/validate:
    get:
      summary: Проверить runtime-конфигурацию
      responses:
        '200':
          description: Validation result
  /config/summary:
    get:
      summary: Краткая runtime-конфигурация без секретов
      responses:
        '200':
          description: Runtime config summary
  /config/env:
    get:
      summary: Redacted env snapshot
      responses:
        '200':
          description: Redacted env
  /secrets:
    get:
      summary: Список encrypted secrets без значений
      responses:
        '200':
          description: Secrets
    post:
      summary: Создать или обновить encrypted secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - key
              - value
              properties:
                key:
                  type: string
                value:
                  type: string
                description:
                  type: string
                reason:
                  type: string
      responses:
        '201':
          description: Secret metadata
  /secrets/{key}:
    get:
      summary: Метаданные secret
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Secret metadata
    put:
      summary: Обновить encrypted secret
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Secret metadata
    delete:
      summary: Удалить encrypted secret
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted
  /secrets/{key}/value:
    get:
      summary: Расшифровать secret; требует secrets:reveal
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Secret value
  /secrets/{key}/rotate:
    post:
      summary: Ротировать encrypted secret
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Secret metadata
  /communities/{communityId}/import-export/export:
    get:
      summary: Экспортировать данные community
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Community export
  /communities/{communityId}/import-export/import:
    post:
      summary: Dry-run или применить импорт данных community
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Import result
  /communities/{communityId}/interactions/commands:
    get:
      summary: Список runtime-команд community
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      - in: query
        name: provider
        required: false
        schema:
          enum:
          - telegram
          - vk
          - discord
      responses:
        '200':
          description: Interaction commands
    post:
      summary: Создать runtime-команду
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Interaction command
  /communities/{communityId}/interactions/commands/{id}:
    get:
      summary: Получить runtime-команду
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Interaction command
    patch:
      summary: Обновить runtime-команду
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Interaction command
  /communities/{communityId}/interactions/menus:
    get:
      summary: Список меню community
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      - in: query
        name: locale
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Interaction menus
    post:
      summary: Создать меню
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Interaction menu
  /communities/{communityId}/interactions/callbacks:
    get:
      summary: Список callback actions
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Callback actions
    post:
      summary: Создать callback action
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Callback action
  /communities/{communityId}/interactions/conversations:
    get:
      summary: Список conversation flows
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Conversation flows
    post:
      summary: Создать conversation flow
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Conversation flow
  /communities/{communityId}/interactions/events:
    get:
      summary: Журнал входящих bot interactions
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      - in: query
        name: take
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Interaction events
    post:
      summary: Записать interaction event из runtime/интеграции
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Interaction event
  /auth/admin/bootstrap:
    post:
      summary: Создать первый admin account через bootstrap token
      security: []
      responses:
        '201':
          description: Admin account
  /auth/login:
    post:
      summary: Login admin account по email/password с optional TOTP/recovery code
      security: []
      responses:
        '201':
          description: Access token
          refresh token and session: null
  /auth/refresh:
    post:
      summary: Rotate refresh token и выпустить новый JWT access token
      security: []
      responses:
        '201':
          description: New token pair
  /auth/logout:
    post:
      summary: Отозвать refresh session
      security: []
      responses:
        '201':
          description: Logout result
  /auth/admin-accounts:
    get:
      summary: Список admin accounts
      responses:
        '200':
          description: Admin accounts
  /auth/sessions:
    get:
      summary: Список admin sessions текущего аккаунта или всех при auth:sessions:manage
      responses:
        '200':
          description: Admin sessions
  /auth/sessions/{id}/revoke:
    post:
      summary: Отозвать admin session
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Revoked session
  /auth/password/change:
    post:
      summary: Сменить пароль admin account и при необходимости отозвать sessions
      responses:
        '201':
          description: Password changed
  /auth/2fa/setup:
    post:
      summary: Создать TOTP secret и otpauth URI
      responses:
        '201':
          description: TOTP setup data
  /auth/2fa/confirm:
    post:
      summary: Подтвердить TOTP и получить recovery codes
      responses:
        '201':
          description: Recovery codes
  /auth/2fa/disable:
    post:
      summary: Отключить TOTP 2FA после password + TOTP/recovery проверки
      responses:
        '201':
          description: Disabled state
  /auth/2fa/recovery-codes/rotate:
    post:
      summary: Перевыпустить recovery codes
      responses:
        '201':
          description: New recovery codes
  /security/hardening:
    get:
      summary: Состояние security hardening
      responses:
        '200':
          description: Hardening status
  /security/rate-limit-violations:
    get:
      summary: Журнал rate-limit violations
      parameters:
      - in: query
        name: take
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Rate-limit violations
  /communities/{communityId}/bot-runtime/status:
    get:
      summary: Runtime status активных bot accounts community
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      - in: query
        name: accountId
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Bot runtime statuses
  /communities/{communityId}/bot-runtime/inbound-updates:
    get:
      summary: Журнал входящих provider updates
      parameters:
      - in: path
        name: communityId
        required: true
        schema:
          type: string
      - in: query
        name: accountId
        required: false
        schema:
          type: string
      - in: query
        name: status
        required: false
        schema:
          type: string
      - in: query
        name: take
        required: false
